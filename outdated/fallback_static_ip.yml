---
- name: Configure static IP for fallback Raspberry Pi
  hosts: fallback
  become: true
  
  tasks:
    - name: Install dhcpcd5
      apt:
        name: dhcpcd5
        state: present

    - name: Get dhcpcd service name
      shell: systemctl list-units | grep -i dhcp
      register: dhcp_service
      changed_when: false
      ignore_errors: true

    - name: Debug service name
      debug:
        var: dhcp_service.stdout_lines

    - name: Configure dhcpcd for static IP
      copy:
        dest: /etc/dhcpcd.conf
        content: |
          # WiFi configuration with static IP
          interface wlan0
          static ip_address={{ ip }}/24
          static routers={{ router_ip | default('0.0.0.0') }}
          static domain_name_servers=8.8.8.8 8.8.4.4
        backup: yes

    - name: Just reboot the system
      reboot:

