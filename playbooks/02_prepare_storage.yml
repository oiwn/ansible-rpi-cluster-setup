---
- name: Storage Setup for Gateway Pi 5
  hosts: main
  become: true
  gather_facts: true
  vars:
    storage_device: /dev/sda
    mount_point: /mnt/k3s-storage
    filesystem: ext4
    partition_number: 1

  tasks:
    - name: Install required packages
      apt:
        name:
          - parted
          - e2fsprogs
          - hdparm
          - util-linux
        state: present
        update_cache: yes

    - name: Unmount any existing filesystem
      shell: umount {{ storage_device }}* || true
      changed_when: false
      ignore_errors: true

    - name: Remove existing mount point from /etc/fstab
      lineinfile:
        path: /etc/fstab
        regexp: "^{{ mount_point }} "
        state: absent

    - name: Wipe existing partition table
      shell: |
        dd if=/dev/zero of={{ storage_device }} bs=512 count=2048
        wipefs -a {{ storage_device }}
      ignore_errors: true

    - name: Verify storage device exists
      stat:
        path: "{{ storage_device }}"
      register: device_check
      failed_when: not device_check.stat.exists

    - name: Create new GPT partition table
      command: parted -s {{ storage_device }} mklabel gpt
      when: device_check.stat.exists

    - name: Create partition
      command: parted -s {{ storage_device }} mkpart primary 0% 100%
      when: device_check.stat.exists

    - name: Format the partition with ext4
      filesystem:
        fstype: "{{ filesystem }}"
        dev: "{{ storage_device }}{{ partition_number }}"
        opts: -F -L k3s-storage
      when: device_check.stat.exists

    - name: Create mount point directory
      file:
        path: "{{ mount_point }}"
        state: directory
        mode: '0755'

    - name: Ensure filesystem is mounted persistently
      mount:
        path: "{{ mount_point }}"
        src: "LABEL=k3s-storage"
        fstype: "{{ filesystem }}"
        opts: defaults,noatime,discard
        state: mounted

    - name: Create Longhorn data directory
      file:
        path: "{{ mount_point }}/longhorn"
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: Get filesystem information
      command: df -h {{ mount_point }}
      register: df_output
      changed_when: false

    - name: Display filesystem information
      debug:
        var: df_output.stdout_lines
