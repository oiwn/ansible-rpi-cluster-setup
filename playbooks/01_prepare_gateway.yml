---
- name: Initial Gateway Pi 5 Setup
  hosts: main
  become: true

  vars:
    required_packages:
      # Network-related packages
      - dnsmasq
      - tcpdump
      - iptables
      # System utilities (should be there already)
      - vim
      - htop
      - git
      - curl

  tasks:
    - name: Update apt cache and upgrade packages
      apt:
        update_cache: yes
        upgrade: yes

    - name: Install required packages
      apt:
        name: "{{ required_packages }}"
        state: present

    # systemd-networkd configuration
    - name: Create network configuration directory
      file:
        path: /etc/systemd/network
        state: directory
        mode: '0755'

    - name: Configure eth0 for static IP
      copy:
        dest: /etc/systemd/network/20-eth0.network
        content: |
          [Match]
          Name=eth0
          
          [Network]
          Address={{ hostvars[inventory_hostname].cluster_ip }}/24
          DHCPServer=yes
          IPMasquerade=yes
          IPForward=yes
        mode: '0644'

    - name: Configure wlan0 for DHCP client
      copy:
        dest: /etc/systemd/network/25-wlan0.network
        content: |
          [Match]
          Name=wlan0
          
          [Network]
          DHCP=yes
        mode: '0644'

    # Enable systemd-networkd
    - name: Enable and start systemd-networkd
      systemd:
        name: systemd-networkd
        enabled: yes
        state: started

    # IP Forwarding Configuration
    - name: Enable IP forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        sysctl_file: /etc/sysctl.d/99-router.conf

    # NAT Configuration
    - name: Set up NAT rules
      iptables:
        table: nat
        chain: POSTROUTING
        out_interface: wlan0
        jump: MASQUERADE
        state: present

    - name: Save iptables rules
      shell: |
        iptables-save > /etc/iptables.rules
      changed_when: false

    - name: Ensure iptables rules load at boot
      copy:
        dest: /etc/systemd/system/iptables-restore.service
        content: |
          [Unit]
          Description=Restore iptables rules
          Before=network-pre.target
          
          [Service]
          Type=oneshot
          ExecStart=/sbin/iptables-restore /etc/iptables.rules
          
          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    # dnsmasq Configuration
    - name: Configure dnsmasq
      copy:
        dest: /etc/dnsmasq.conf
        content: |
          interface=eth0
          bind-dynamic   # Changed from bind-interfaces to allow DNS forwarding
          domain-needed
          bogus-priv

          # DNS configuration
          server=192.168.1.1   # Add your working DNS from raspb1s
          no-resolv   # Don't read /etc/resolv.conf
          no-poll     # Don't poll /etc/resolv.conf

          dhcp-range={{ hostvars[inventory_hostname].cluster_ip.split('.')[0:3] | join('.') }}.100,{{ hostvars[inventory_hostname].cluster_ip.split('.')[0:3] | join('.') }}.200,12h
          dhcp-option=option:router,{{ hostvars[inventory_hostname].cluster_ip }}
          dhcp-option=option:dns-server,{{ hostvars[inventory_hostname].cluster_ip }}
          # dhcp-option=option:dns-server,8.8.8.8,8.8.4.4
          
          # Static DHCP assignments for worker nodes
          {% for host in groups['workers'] %}
          dhcp-host={{ hostvars[host].mac_address }},{{ hostvars[host].ip }}
          {% endfor %}
        mode: '0644'

    - name: Enable and start dnsmasq
      systemd:
        name: dnsmasq
        enabled: yes
        state: started
        daemon_reload: yes

    # Enable and start required services
    - name: Enable and start required services
      systemd:
        name: "{{ item }}"
        enabled: yes
        state: started
        daemon_reload: yes
      loop:
        - systemd-networkd
        - iptables-restore
        - dnsmasq

    # Final verification
    - name: Verify network configuration
      shell: |
        echo "=== Network Interfaces ==="
        ip addr show
        echo -e "\n=== Routes ==="
        ip route
        echo -e "\n=== IP Forward Status ==="
        sysctl net.ipv4.ip_forward
        echo -e "\n=== NAT Rules ==="
        iptables -t nat -L
        echo -e "\n=== Service Status ==="
        systemctl status systemd-networkd --no-pager
        systemctl status dnsmasq --no-pager
      register: network_status
      changed_when: false

    - name: Display network status
      debug:
        var: network_status.stdout_lines
