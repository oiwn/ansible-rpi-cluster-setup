---
- name: Connectivity check
  hosts: main
  gather_facts: yes
  tasks:
    - name: Ping
      ansible.builtin.ping:

    - name: Show basics
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} | {{ ansible_hostname }} |
          {{ ansible_distribution }} {{ ansible_distribution_version }} |
          kernel {{ ansible_kernel }} |
          ifaces: {{ ansible_interfaces | join(', ') }}
